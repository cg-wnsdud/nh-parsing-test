[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 이 파일을 고친 뒤에는 반드시 확인할 것 (2026-08-06 에 이 순서로 검증했다):
#   uv build --wheel --out-dir /tmp/dist   # 휠이 만들어지는가
#   python -c "import zipfile; print(zipfile.ZipFile('...whl').namelist())"
#                                          # schemas/*.json 이 들어갔는가
#   uv sync && uv run python -c "import nh_parsing"   # 설치·import 되는가

[project]
name = "nh-ad-review-poc"
version = "0.1.0"
description = "NH 광고심의 PoC — 초기 파싱 파이프라인 프로토타입"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.7",
    "pypdfium2>=5.9.0,<6.0.0",
    "pillow>=10.0",
    "requests>=2.32",
    # 사내 파서 (HWP/HWPX 트랙). PDF 트랙은 pypdfium2로 자체 triage.
    "document-processor @ git+https://github.com/CGINSIDE-ROOKIES/document-processor.git",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = ["pytest>=8.0"]

# 2026-08-06: `[tool.uv] package = false` 를 제거했다. "샌드박스 앱 제어 정책이 빌드
# 백엔드 실행을 차단한다"고 적혀 있었으나 **실측으로 사실이 아니었다** — `uv build --wheel`
# 을 돌려 보니 hatchling 이 정상 실행됐고, 실패 원인은 아래 allow-direct-references 가
# 없어서 git URL 의존성(document-processor)이 메타데이터 검증에서 거부된 것이었다.
# 이제 정식 패키지로 설치되므로 러너·테스트의 `sys.path.insert` 가 필요 없다.

# 스키마 데이터 파일(src/nh_parsing/schemas/*.json)은 이 설정만으로 휠에 들어간다 —
# hatchling 은 packages 아래의 **모든** 파일을 담는다. force-include 를 따로 쓰면
# 같은 경로가 두 번 추가돼 빌드가 실패한다(2026-08-06 실측:
# "A second file is being added to the wheel archive at the same path").
[tool.hatch.build.targets.wheel]
packages = ["src/nh_parsing"]

# 사내 파서를 git URL 로 직접 참조하므로(dependencies 의 document-processor) 이 플래그가
# 없으면 hatchling 이 메타데이터 검증에서 거부한다 — 2026-08-06 실측 에러 메시지:
#   "Dependency #5 of field `project.dependencies` cannot be a direct reference
#    unless field `tool.hatch.metadata.allow-direct-references` is set to `true`"
[tool.hatch.metadata]
allow-direct-references = true
